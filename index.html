<!doctype html>
<html lang="en">
<head>
<meta name="description" content="Landed cost, IVA, cash flow and marketplace P&L simulator for importing products from China to Chile.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Import Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Archivo:wght@700;800&display=swap">
<style>
:root{
  --bg:#0E1116;--panel:#161A21;--panel2:#1D222B;--line:#2A303B;--text:#E8EBF0;--muted:#9BA4B3;
  --accent:#5AA2FF;--accent-ink:#06121F;--good:#3DD68C;--bad:#FF8F6B;--warn:#F5C451;
  --c1:#5AA2FF;--c2:#F5A35B;--c3:#3DD68C;--c4:#C58BFF;--c5:#FF7A9C;--c6:#4FD1D9;
  --stripe:#1B2029;
}
:root[data-theme="light"]{
  --bg:#F3F5F8;--panel:#FFFFFF;--panel2:#F6F8FB;--line:#DCE1E8;--text:#0F1620;--muted:#56606F;
  --accent:#1D5FD1;--accent-ink:#FFFFFF;--good:#0E7C55;--bad:#B63F17;--warn:#8A6100;
  --c1:#1D5FD1;--c2:#D9731F;--c3:#0E9A66;--c4:#8A4BD6;--c5:#D6336C;--c6:#0C8E98;
  --stripe:#EEF1F5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif}
.mono,.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.seg button[aria-checked="true"] .mut{color:inherit;opacity:.8}
input,select,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.top h1{margin:0;font:800 18px Archivo,sans-serif;letter-spacing:-.01em}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.top .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 12px;font-weight:600;font-size:13px;min-height:36px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}

.app{display:grid;grid-template-columns:350px minmax(0,1fr);gap:0;min-height:calc(100vh - 62px)}
aside{border-right:1px solid var(--line);background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 62px);overflow:auto;position:sticky;top:0;align-self:start}
main{padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}

h2.sec{margin:0;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;gap:8px;text-align:left;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.pitem[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.pitem .dot{width:10px;height:10px;border-radius:3px;flex:none}
.pitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pitem .pv{font-size:12px}
.pos{color:var(--good)}.neg{color:var(--bad)}.mut{color:var(--muted)}

details.grp{border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
details.grp>summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;align-items:center;gap:8px;font-weight:600;min-height:44px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .hint{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px}
details.grp>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:6px;margin-top:-3px}
details.grp[open]>summary::after{transform:rotate(-135deg);margin-top:3px}
.fields{padding:2px 12px 12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px;width:100%;font-size:14px}
label.f textarea{min-height:80px;resize:vertical}
label.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);min-height:40px}
label.chk input{width:18px;height:18px;accent-color:var(--accent)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:9px;font-weight:600;font-size:13px;color:var(--muted);min-height:38px}
.seg button{white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
.note{font-size:12px;color:var(--muted);line-height:1.5}
[hidden]{display:none!important}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:"JetBrains Mono",monospace;font-size:24px;font-weight:600;margin-top:2px;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.main{border-color:var(--accent)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 14px;font-weight:600;color:var(--muted);white-space:nowrap;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--text);border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{margin:0 0 10px;font:700 16px Archivo,sans-serif}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.verdict{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.verdict .big{font:800 44px Archivo,sans-serif;letter-spacing:-.02em}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid currentColor}
.sug{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left}
.sug .t{font-size:12px;font-weight:600;color:var(--accent)}
.sug .h{font-weight:600;font-size:15px}
.sug .d{font-size:13px;color:var(--muted)}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:10px;border-bottom:1px solid var(--line);text-align:right}
table.t tr.tot td{font-weight:700;border-top:2px solid var(--line)}
table.t tr.hl td{background:var(--panel2)}
.tablewrap{overflow-x:auto}

.wf{display:flex;flex-direction:column;gap:6px}
.wfr{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr) 110px;align-items:center;gap:12px;font-size:13px}
.wfr .bar{height:20px;background:var(--stripe);border-radius:5px;position:relative;overflow:hidden}
.wfr .bar i{position:absolute;top:0;bottom:0;border-radius:5px}
.wfr .v{text-align:right}
.wfr.sub .lab,.wfr.fin .lab{font-weight:700}
.wfr.fin{border-top:1px solid var(--line);padding-top:8px;margin-top:4px}

.stack{display:flex;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;margin-top:8px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend b{width:10px;height:10px;border-radius:3px;display:inline-block}

.cont{display:flex;height:96px;border-radius:12px;overflow:hidden;border:2px solid var(--text)}
.cont .empty{flex:1;background:repeating-linear-gradient(135deg,var(--panel) 0 10px,var(--stripe) 10px 20px);display:flex;align-items:center;justify-content:center;color:var(--muted);font:700 17px Archivo,sans-serif;text-align:center;padding:0 8px}
.pcard{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.pcard.off{opacity:.8;border-style:dashed}
.pcard .hd{display:flex;align-items:center;gap:8px}
.pcard .hd h4{margin:0;font:700 15px Archivo,sans-serif;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini div{background:var(--panel2);border-radius:9px;padding:9px 10px}
.mini small{display:block;color:var(--muted);font-size:11px}
.mini b{font-family:"JetBrains Mono",monospace;font-size:15px}
.dark{background:#0A0C10;color:#F1F3F6;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:9px;border:1px solid var(--line)}
:root[data-theme="light"] .dark{background:#10151D}
.dark .r{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:#C9CFD8}
.dark .r b{color:#fff;font-family:"JetBrains Mono",monospace;font-weight:500}
.dark .r.t{border-top:1px solid #333B48;padding-top:10px;font-size:16px}
.dark .r.t b{font-weight:700}

.warn{border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px}

.ideas{padding:20px;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ideas .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.ideas .row>label.f{flex:1 1 200px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.icard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.icard .hd{display:flex;gap:8px;align-items:flex-start}
.icard h4{margin:0;font:700 16px Archivo,sans-serif;flex:1;min-width:0;overflow-wrap:anywhere}
.chk3{display:flex;flex-direction:column;gap:8px}
.chk3 .c{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.chk3 .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:20px}
.chk3 .dot.ok{background:var(--good);border-color:var(--good)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.pill.warnc{color:var(--warn)}
.menu{position:absolute;right:0;top:44px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:200px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.menu .btn{text-align:left;width:100%}
.top .sp{position:relative}
details.adv{border-top:1px dashed var(--line);padding-top:6px}
details.adv>summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;padding:8px 0;list-style:none}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::before{content:"+ "}
details.adv[open]>summary::before{content:"- "}
.lnk{background:none;border:0;padding:0;font-weight:600;text-align:left;text-decoration:underline dotted;text-underline-offset:3px;color:var(--text)}
.lnk:hover{color:var(--accent)}
.dotc{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.badge[data-s="unsaved"],.badge[data-s="toobig"]{color:var(--bad);border-color:var(--bad)}
.badge[data-s="saving"],.badge[data-s="wait"]{color:var(--warn)}
.photos{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.ph{position:relative;display:inline-block}
.phb{border:1px solid var(--line);border-radius:8px;padding:0;background:none;overflow:hidden;width:72px;height:72px}
.phb img{width:100%;height:100%;object-fit:cover;display:block}
.phx{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:15px;line-height:1;padding:0}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:70;padding:24px;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:100%;border-radius:6px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
#modal p{margin:0;font-size:15px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid3{grid-template-columns:1fr}
  .wfr{grid-template-columns:minmax(110px,150px) minmax(0,1fr) 92px;gap:8px}
}
@media (max-width:520px){
  main{padding:14px}
  .kpi .v{font-size:19px}
  .verdict .big{font-size:34px}
}
</style>
</head>
<body>
<div class="top">
  <h1>Import Simulator</h1>
  <span class="badge" id="status" data-s="local" role="status">Saved in this browser</span>
  <div class="seg" id="viewSw" role="radiogroup" aria-label="Section" style="min-width:250px">
    <button type="button" role="radio" data-view="sim">Simulator</button>
    <button type="button" role="radio" data-view="ideas">Ideas <span id="ideaCount" class="mut"></span></button>
  </div>
  <div class="sp">
    <button class="btn" id="btnMenu" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu">Menu ⋯</button>
    <div class="menu" id="menu" hidden>
      <button class="btn pri" id="btnAuth" type="button" hidden>Sign in with Google</button>
      <button class="btn" id="btnTheme" type="button">Light / dark</button>
      <button class="btn" id="btnExport" type="button">Export data</button>
      <button class="btn" id="btnImport" type="button">Import data</button>
      <button class="btn danger" id="btnReset" type="button">Reset to baseline</button>
    </div>
    <input type="file" id="fileIn" accept="application/json" hidden>
  </div>
</div>

<div class="app" id="appSim">
  <aside aria-label="Products and inputs">
    <div id="who" hidden>
      <h2 class="sec">Numbers of</h2>
      <div class="seg" role="radiogroup" aria-label="Whose numbers" style="margin-top:8px"><button type="button" role="radio" data-prof="andre">André</button><button type="button" role="radio" data-prof="agustin">Agustín</button></div>
      <p class="note" id="authInfo" style="margin:8px 0 0"></p>
    </div>
    <div>
      <h2 class="sec">Products</h2>
      <div class="plist" id="plist" style="margin-top:8px"></div>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <button class="btn pri" id="btnAdd" type="button">+ Add product</button>
        <button class="btn" id="btnDup" type="button">Duplicate</button>
        <button class="btn danger" id="btnDel" type="button">Delete</button>
      </div>
    </div>
    <div id="form"></div>
  </aside>

  <main>
    <div class="kpis" id="kpis"></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="view"></div>
  </main>
</div>

<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalText"><div class="box"><p id="modalText"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" id="modalNo">Cancel</button><button type="button" class="btn pri" id="modalYes">OK</button></div></div></div>
<div id="toast" hidden role="status"></div>
<div id="lightbox" hidden><img alt="Reference photo, enlarged"></div>

<section class="ideas" id="appIdeas" hidden aria-label="Ideas to investigate"></section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
(function () {
  'use strict';

  /* ===== calculation core, copied unchanged from the live simulator ===== */
  var IVA = 0.19;
  function n(v) { v = parseFloat(v); return isFinite(v) && v >= 0 ? v : 0; }

  function calcSim(s) {
    var qty = Math.max(0, Math.round(n(s.qty)));
    var goods = qty * n(s.price);
    var weight = qty * n(s.kgu);
    var cartonCm3 = n(s.cl) * n(s.cw) * n(s.ch);
    var upc = Math.max(1, Math.round(n(s.upc)) || 1);
    var cartons = cartonCm3 > 0 ? Math.ceil(qty / upc) : 0;
    var cbm = cartons * cartonCm3 / 1e6;
    var vdiv = n(s.vdiv) || 6000;
    var volWeight = cartons * cartonCm3 / vdiv;
    var chargeable = Math.max(weight, volWeight);
    var alloc = arguments[1] || null;
    var mode = alloc ? 'lcl' : 'air';
    var freight = alloc ? alloc.freight : chargeable * n(s.rate) + n(s.origin);
    var ins = goods * n(s.insp) / 100;
    var cif = goods + freight + ins;
    var dutyRate = n(s.duty) / 100;
    var duty = cif * dutyRate;
    var ivaBase = cif + duty;
    var iva = ivaBase * IVA;
    var agent = alloc ? alloc.agent : n(s.agent);
    var total = goods + freight + ins + duty + iva + agent;
    var net = total - iva;
    var dep = Math.min(100, n(s.dep)) / 100;
    return {
      mode: mode, alloc: alloc, cartons: cartons, cbm: cbm, volWeight: volWeight, chargeable: chargeable, vdiv: vdiv,
      qty: qty, goods: goods, weight: weight, freight: freight, ins: ins, cif: cif,
      dutyRate: dutyRate, duty: duty, ivaBase: ivaBase, iva: iva, agent: agent,
      total: total, net: net, deposit: goods * dep,
      perUnitNet: qty > 0 ? net / qty : 0,
      perUnitGross: qty > 0 ? total / qty : 0
    };
  }

  function lclAlloc(products, cfg) {
    var out = {};
    if (!cfg || !cfg.on) return { map: out, totalCbm: 0, billed: 0, cost: 0, goods: 0, ids: [] };
    var sel = products.filter(function (p) { return p.sim.lcl === true || p.sim.lcl === '1'; });
    var base = sel.map(function (p) { return { id: p.id, r: calcSim(p.sim) }; });
    var totalCbm = 0, goods = 0;
    base.forEach(function (b) { totalCbm += b.r.cbm; goods += b.r.goods; });
    var billed = sel.length ? Math.max(totalCbm, n(cfg.min)) : 0;
    var cost = billed * n(cfg.rate);
    base.forEach(function (b) {
      var share = cfg.split === 'value' ? (goods > 0 ? b.r.goods / goods : 0) : (totalCbm > 0 ? b.r.cbm / totalCbm : 0);
      out[b.id] = {
        freight: cost * share,
        agent: goods > 0 ? n(cfg.agent) * b.r.goods / goods : 0,
        cbm: b.r.cbm, totalCbm: totalCbm, billed: billed
      };
    });
    return { map: out, totalCbm: totalCbm, billed: billed, cost: cost, goods: goods, ids: sel.map(function (p) { return p.id; }) };
  }

  var FULL = {
    S: { day: 0.83, a: 140, b: 1450, c: 3000 },
    M: { day: 2.33, a: 235, b: 2200, c: 3700 },
    L: { day: 10.33, a: 630, b: 5700, c: 9800 },
    XL: { day: 19.33, a: 825, b: 7500, c: 12500 }
  };
  function isMercadoLibre(mk) { return mk && (mk.id === 'ml' || mk.id === 'mlp' || /mercado ?libre/i.test(mk.name || '')); }
  function fullCost(Q, d, size) {
    var t = FULL[size] || FULL.S;

  function shrink(file, max, q) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var sc = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
        var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error('encode')); }, 'image/jpeg', q);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('load')); };
      img.src = url;
    });
  }
  function blobToDataUrl(b) { return new Promise(function (res, rej) { var fr = new FileReader(); fr.onload = function () { res(fr.result); }; fr.onerror = rej; fr.readAsDataURL(b); }); }

     Ideas live in workspaces/andre-agustin/ideas and are common to both profiles.
     Only the two emails below can read or write; firestore.rules enforces the same list. */
  var FB = window.FIREBASE_CONFIG || null;
  var PROFILES = { andre: 'André', agustin: 'Agustín' };
  var ALLOWED = { 'antunes.de.diogo@gmail.com': 'andre', 'agustin.oelckers@gmail.com': 'agustin' };
  var fbUser = null, fbDb = null, profile = null, who = null, itemsCol = null, ideasCol = null, unsubItems = null, unsubIdeas = null;
  var syncTimer = null, lastItems = {}, lastIdeas = {}, lastSettings = '', loadedItems = false, seeded = false;

  function canon(o) {
    if (Array.isArray(o)) return '[' + o.map(canon).join(',') + ']';
    if (o && typeof o === 'object') return '{' + Object.keys(o).sort().map(function (k) { return JSON.stringify(k) + ':' + canon(o[k]); }).join(',') + '}';
    return JSON.stringify(o);
  }
  function canonP(p) { var c = Object.assign({}, p); delete c.updatedBy; delete c.updatedAt; return canon(c); }
  function allowedProfile(u) { return u && u.email ? ALLOWED[u.email.toLowerCase()] || null : null; }
  function prefProfile() { try { return localStorage.getItem('importsim.profile'); } catch (e) { return null; } }

  function dirty() {
    if (mode !== 'shared' || !loadedItems) return false;
    var d = false;
    S.products.forEach(function (p) { if (lastItems[p.id] !== canonP(p)) d = true; });
    Object.keys(lastItems).forEach(function (id) { if (!S.products.some(function (p) { return p.id === id; })) d = true; });
    if (canon(S.settings) !== lastSettings) d = true;
    S.ideas.forEach(function (i) { if (lastIdeas[i.id] !== canon(i)) d = true; });
    Object.keys(lastIdeas).forEach(function (id) { if (!S.ideas.some(function (i) { return i.id === id; })) d = true; });
    return d;
  }
  function scheduleSync() {
    if (!dirty()) return;
    setStatus('saving'); clearTimeout(syncTimer); syncTimer = setTimeout(syncUp, 600);
  }
  function syncUp() {
    syncTimer = null;
    if (mode !== 'shared' || !loadedItems || !itemsCol) return;
    var col = itemsCol, icol = ideasCol, ops = [], big = false;
    S.products.forEach(function (p) {
      var c = canonP(p);
      if (lastItems[p.id] === c) return;
      p.updatedBy = who; p.updatedAt = Date.now();
      var data = JSON.parse(JSON.stringify(p));
      if (JSON.stringify(data).length > 900000) { big = true; return; }
      lastItems[p.id] = c; ops.push(col.doc(p.id).set(data));
    });
    Object.keys(lastItems).forEach(function (id) {
      if (!S.products.some(function (p) { return p.id === id; })) { delete lastItems[id]; ops.push(col.doc(id).delete()); }
    });
    var sc = canon(S.settings);
    if (sc !== lastSettings) { lastSettings = sc; ops.push(col.doc('settings').set(JSON.parse(JSON.stringify(S.settings)))); }
    S.ideas.forEach(function (i) { var c = canon(i); if (lastIdeas[i.id] !== c) { lastIdeas[i.id] = c; ops.push(icol.doc(i.id).set(JSON.parse(JSON.stringify(i)))); } });
    Object.keys(lastIdeas).forEach(function (id) {
      if (!S.ideas.some(function (i) { return i.id === id; })) { delete lastIdeas[id]; ops.push(icol.doc(id).delete()); }
    });
    if (big) { setStatus('toobig'); return; }
    if (formBuilt) applyVis();
    Promise.all(ops).then(function () { if (!syncTimer) setStatus('saved'); }, function () { setStatus('unsaved'); });
  }

  function onItems(snap) {
    var remote = {}, sdoc = null, ids;
    snap.docs.forEach(function (d) {
      var data = d.data(); if (!data) return;
      if (d.id === 'settings') sdoc = data; else if (d.id.indexOf('p_') === 0) remote[d.id] = data;
    });
    ids = Object.keys(remote);
    if (!ids.length) {
      if (!snap.metadata.fromCache && !seeded) {
        seeded = true; loadedItems = true; lastItems = {}; lastSettings = '';
        S.products = [seedProduct()]; S.settings = normSettings(); S.active = 'p_seed';
        syncUp(); formBuilt = false; refresh(false);
      }
      return;
    }
    loadedItems = true;
    var next = [], known = {};
    ids.forEach(function (id) {
      var loc = S.products.filter(function (x) { return x.id === id; })[0];
      if (loc && lastItems[id] !== undefined && canonP(loc) !== lastItems[id]) { next.push(loc); return; } /* unsynced local edit wins */
      if (!loc && lastItems[id] !== undefined) return; /* deleted here, delete still on its way */
      var np = normProduct(remote[id]); next.push(np); lastItems[id] = canonP(np);
    });
    S.products.forEach(function (loc) { if (!remote[loc.id] && lastItems[loc.id] === undefined) next.push(loc); });
    Object.keys(lastItems).forEach(function (id) { if (!remote[id]) delete lastItems[id]; });
    next.sort(function (a, b) { return (a.created || 0) - (b.created || 0); });
    S.products = next.length ? next : [seedProduct()];
    if (!S.products.some(function (p) { return p.id === S.active; })) S.active = S.products[0].id;
    var mkChanged = false;
    if (sdoc && !(lastSettings && canon(S.settings) !== lastSettings)) {
      var ns = normSettings(sdoc);
      mkChanged = canon(ns.mk) !== canon(S.settings.mk);
      S.settings = ns; lastSettings = canon(ns);
    }
    if (!snap.metadata.fromCache && !syncTimer) setStatus('saved');
    if (mkChanged) formBuilt = false;
    if (S.view === 'sim') {
      var f = document.activeElement, typing = f && $('form').contains(f) && /^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName);
      refresh(!!typing && !mkChanged);
    } else { recompute(); showView(false); }
  }
  function onIdeas(snap) {
    var remote = {};
    snap.docs.forEach(function (d) { var data = d.data(); if (data && d.id.indexOf('i_') === 0) remote[d.id] = data; });
    var next = [];
    Object.keys(remote).forEach(function (id) {
      var loc = S.ideas.filter(function (x) { return x.id === id; })[0];
      if (loc && lastIdeas[id] !== undefined && canon(loc) !== lastIdeas[id]) { next.push(loc); return; }
      if (!loc && lastIdeas[id] !== undefined) return;
      var ni = normIdea(remote[id]); next.push(ni); lastIdeas[id] = canon(ni);
    });
    S.ideas.forEach(function (loc) { if (!remote[loc.id] && lastIdeas[loc.id] === undefined) next.push(loc); });
    Object.keys(lastIdeas).forEach(function (id) { if (!remote[id]) delete lastIdeas[id]; });
    S.ideas = next;
    var f = document.activeElement, typing = f && $('appIdeas').contains(f) && /^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName);
    if (S.view === 'ideas' && !typing) renderIdeas(); else showView(false);
  }

  function renderWho() {
    var ok = !!allowedProfile(fbUser), btns = document.querySelectorAll('#who .seg button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].disabled = !ok;
      btns[i].setAttribute('aria-checked', ok && btns[i].getAttribute('data-prof') === profile ? 'true' : 'false');
    }
    $('btnAuth').textContent = fbUser ? 'Sign out' : 'Sign in with Google';
    $('authInfo').textContent = !fbUser
      ? 'Sign in to see and edit the shared André and Agustín numbers and ideas. Until then, changes stay in this browser.'
      : ok ? 'Signed in as ' + fbUser.email + '. Editing ' + PROFILES[profile] + '’s numbers; both of you see the changes.'
      : fbUser.email + ' has no access to the shared numbers. Changes stay in this browser.';
  }
  function flushSync() { if (syncTimer) { clearTimeout(syncTimer); syncUp(); } }
  function openProfile(pid) {
    if (!fbDb || !PROFILES[pid]) return;
    if (mode === 'shared' && profile === pid) return;
    flushSync();
    if (unsubItems) { unsubItems(); unsubItems = null; }
    var firstOpen = mode !== 'shared';
    profile = pid; who = PROFILES[allowedProfile(fbUser)];
    try { localStorage.setItem('importsim.profile', pid); } catch (e) {}
    itemsCol = fbDb.collection('workspaces/andre-agustin/profiles/' + pid + '/items');
    mode = 'shared'; loadedItems = false; seeded = false; lastItems = {}; lastSettings = '';
    S.products = [seedProduct()]; S.settings = normSettings(); S.active = 'p_seed'; S.me = who;
    if (firstOpen) { S.ideas = []; lastIdeas = {}; ideasCol = fbDb.collection('workspaces/andre-agustin/ideas'); }
    setStatus('wait');
    var col = itemsCol;
    unsubItems = col.onSnapshot(function (snap) { if (col === itemsCol) onItems(snap); }, function (err) {
      setStatus('unsaved'); $('authInfo').textContent = 'Could not open the shared numbers (' + (err && err.code ? err.code : 'error') + '). Check the Firestore rules.';
    });
    if (firstOpen) unsubIdeas = ideasCol.onSnapshot(onIdeas, function () { setStatus('unsaved'); });
    formBuilt = false; refresh(false); renderWho();
  }
  function leaveShared() {
    flushSync();
    if (unsubItems) { unsubItems(); unsubItems = null; }
    if (unsubIdeas) { unsubIdeas(); unsubIdeas = null; }
    if (mode === 'shared') {
      var d = load(); mode = 'local'; profile = null; who = null;
      S.products = d.products; S.settings = d.settings; S.ideas = d.ideas; S.me = d.me;
      S.active = S.products.some(function (p) { return p.id === S.active; }) ? S.active : S.products[0].id;
      formBuilt = false; refresh(false); setStatus('local');
    }
  }
  function initFirebase() {
    if (!FB) return;
    $('who').hidden = false; $('btnAuth').hidden = false;
    if (!window.firebase || !firebase.initializeApp) {
      $('authInfo').textContent = 'The shared database did not load. Changes stay in this browser.'; $('btnAuth').disabled = true; return;
    }
    try { firebase.initializeApp(FB); fbDb = firebase.firestore(); } catch (e) {
      $('authInfo').textContent = 'The shared database did not start. Changes stay in this browser.'; return;
    }
    firebase.auth().onAuthStateChanged(function (u) {
      fbUser = u;
      var own = allowedProfile(u);
      if (own) { var pref = prefProfile(); openProfile(PROFILES[pref] ? pref : own); } else { leaveShared(); }
      renderWho();
    });
    $('btnAuth').addEventListener('click', function () {
      if (fbUser) { flushSync(); firebase.auth().signOut(); return; }
      var provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      firebase.auth().signInWithPopup(provider).then(null, function (e) {
        $('authInfo').textContent = e && e.code === 'auth/popup-blocked' ? 'The sign-in window was blocked. Allow pop-ups for this page and try again.' : 'Sign-in did not finish (' + (e && e.code ? e.code : 'error') + ').';
      });
    });
    document.querySelector('#who .seg').addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button[data-prof]') : null;
      if (b && !b.disabled) openProfile(b.getAttribute('data-prof'));
    });
    renderWho();
  }
  window.addEventListener('pagehide', flushSync);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flushSync(); });

  refresh(false);
  setStatus('local');
  initFirebase();
})();
</script>
</body>
</html>
